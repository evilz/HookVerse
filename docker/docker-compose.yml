version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hookverse-postgres
    environment:
      POSTGRES_DB: hookverse
      POSTGRES_USER: hookverse
      POSTGRES_PASSWORD: hookverse_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hookverse-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: hookverse
      RABBITMQ_DEFAULT_PASS: hookverse_dev_password
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hookverse-redis
    command: redis-server --requirepass hookverse_dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment to run the API in Docker
  # api:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.api
  #   container_name: hookverse-api
  #   environment:
