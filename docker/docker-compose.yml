  #     postgres:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  # Uncomment to run the Worker in Docker
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.worker
  #   container_name: hookverse-worker
  #   environment:
  #     - ConnectionStrings__DefaultConnection=Host=postgres;Database=hookverse;Username=hookverse;Password=hookverse_dev_password
  #     - RabbitMQ__Host=rabbitmq
  #     - RabbitMQ__Username=hookverse
