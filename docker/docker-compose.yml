  #     - ConnectionStrings__DefaultConnection=Host=postgres;Database=hookverse;Username=hookverse;Password=hookverse_dev_password
  #     - RabbitMQ__Host=rabbitmq
  #     - RabbitMQ__Username=hookverse
  #     - RabbitMQ__Password=hookverse_dev_password
  #     - Redis__ConnectionString=redis:6379,password=hookverse_dev_password
  #   ports:
  #     - "5000:8080"
